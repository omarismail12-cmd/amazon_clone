name: amazon
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  country_picker: ^2.0.20
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  provider: ^6.0.5
  page_transition: ^2.0.9
  persistent_bottom_nav_bar_v2: ^6.4.0
  carousel_slider: ^5.1.2
  cloud_firestore: ^6.9.0
  uuid: ^3.0.7
  image_picker: ^1.2.3
  http: ^1.2.2
  flutter_rating_bar: ^4.0.1
  razorpay_flutter: ^1.4.6
  motion_toast: ^2.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

dependency_overrides:
  # motion_toast pulls in fluttertoast 8.2.2 transitively, which doesn't
  # declare an Android Gradle namespace and fails to build under AGP 8+.
  # fluttertoast isn't used directly by this app; force the transitive
  # resolution to a version with the namespace fix.
  fluttertoast: 8.2.14
  # image_picker_android 0.8.13+17 pins flutter_plugin_android_lifecycle
  # 2.0.15, which still calls the removed v1 Android embedding API
  # (PluginRegistry.Registrar) and fails to compile. Force a version that
  # dropped the v1 embedding codepath.
  flutter_plugin_android_lifecycle: ^2.0.28
  # firebase_core_web 3.11.0 (pulled in by firebase_core ^4.14.0) calls
  # e.isA<JSObject>() on a catch clause typed Object; that extension only
  # applies to Object on Dart >=3.12, but this project is on Dart 3.10.4,
  # so it fails to compile for web (see firebase/flutterfire#18611, fixed
  # in firebase/flutterfire#18612 but not yet published to pub.dev). Pin
  # back to 3.10.0, the last version before the offending change.
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/menu_pics/
    - assets/images/banners/
